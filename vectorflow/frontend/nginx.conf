# Per-IP request limits at the edge (first line of defence against floods/brute force).
limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
limit_req_status 429;

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;          # don't advertise the nginx version
    include /etc/nginx/snippets/security-headers.conf;

    # Resolve the gateway through Docker's DNS at request time, so nginx keeps
    # working when the gateway container is recreated (and still starts if the
    # gateway isn't up yet).
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $gateway http://gateway:8080;

    # API calls go to the gateway, so the browser only ever talks to one origin.
    location /graphql {
        limit_req zone=api burst=30 nodelay;
        proxy_pass $gateway;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 180s;     # ingesting large documents can take a while
        client_max_body_size 16m;
    }

    # File uploads (PDF/DOCX) - REST endpoint on the gateway.
    location /api/ {
        limit_req zone=api burst=20 nodelay;
        proxy_pass $gateway;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 180s;
        client_max_body_size 21m;
        # Streamed answers (Server-Sent Events) must reach the browser immediately
        proxy_buffering off;
        proxy_cache off;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    location /actuator/health {
        proxy_pass $gateway;
    }

    # Hashed build assets can be cached forever.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        include /etc/nginx/snippets/security-headers.conf;
    }

    # Single-page app: unknown paths serve index.html.
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
        include /etc/nginx/snippets/security-headers.conf;
    }
}

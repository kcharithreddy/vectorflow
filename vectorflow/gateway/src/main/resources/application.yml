spring:
  application:
    name: vectorflow-gateway

  graphql:
    path: /graphql
    graphiql:
      enabled: ${GRAPHIQL_ENABLED:true}
      path: /graphiql
    schema:
      locations: classpath:graphql/
      introspection:
        enabled: ${GRAPHQL_INTROSPECTION:true}
      printer:
        enabled: true   # GET /graphql/schema

  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:vectorflow_sql_db}
    username: ${POSTGRES_USER:vectorflow}
    password: ${POSTGRES_PASSWORD:vectorflow123}
    driver-class-name: org.postgresql.Driver

  # Schema changes are versioned migrations (src/main/resources/db/migration).
  # Existing databases created by scripts/init-db.sql are baselined at version 1.
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 1
    locations: classpath:db/migration

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    show-sql: false

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2s

  cache:
    type: redis

  mvc:
    async:
      request-timeout: 180s   # streaming answers

  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 21MB

  jackson:
    serialization:
      write-dates-as-timestamps: false

server:
  port: 8080
  shutdown: graceful
  error:
    include-stacktrace: never
    include-message: never

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
  health:
    redis:
      enabled: true

app:
  python-service:
    url: ${PYTHON_SERVICE_URL:http://localhost:8000}
    api-key: ${INTERNAL_API_KEY:}
    connect-timeout: ${PYTHON_SERVICE_CONNECT_TIMEOUT:PT5S}
    response-timeout: ${PYTHON_SERVICE_RESPONSE_TIMEOUT:PT180S}
  jwt:
    secret: ${JWT_SECRET:vectorflow-super-secret-key-change-in-production}
    expiration: ${JWT_EXPIRATION_MS:86400000}  # 24 hours
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:8080}
  cache:
    search-ttl: ${SEARCH_CACHE_TTL:PT5M}
    ask-ttl: ${ASK_CACHE_TTL:PT10M}
  security:
    # true = refuse to start with default secrets (use for anything public)
    strict: ${SECURITY_STRICT:false}
  rate-limit:
    enabled: ${RATE_LIMIT_ENABLED:true}
    ask-per-minute: ${RATE_LIMIT_ASK_PER_MINUTE:30}
    uploads-per-hour: ${RATE_LIMIT_UPLOADS_PER_HOUR:60}
    login-failures-per-15-min: ${RATE_LIMIT_LOGIN_FAILURES:10}
    registrations-per-hour: ${RATE_LIMIT_REGISTRATIONS_PER_HOUR:10}
  graphql:
    max-depth: 10
    max-complexity: 300

logging:
  level:
    com.vectorflow: ${LOG_LEVEL:INFO}
    AUDIT: INFO

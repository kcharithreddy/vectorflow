# VectorFlow - full stack
#   cp env.sample .env   # then set OPENAI_API_KEY (and real secrets for anything public)
#   docker compose up --build
#
# Only the web app (3000, nginx with security headers + rate limits) is exposed publicly.
# The gateway, AI service and databases are bound to 127.0.0.1 (reachable from this machine only).

x-postgres-env: &postgres-env
  POSTGRES_DB: ${POSTGRES_DB:-vectorflow_sql_db}
  POSTGRES_USER: ${POSTGRES_USER:-vectorflow}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vectorflow123}

services:
  qdrant:
    image: qdrant/qdrant:v1.19.2   # keep in step with qdrant-client in python-service/requirements.txt
    container_name: vectorflow-qdrant
    restart: unless-stopped
    ports:
      - "127.0.0.1:6333:6333"
      - "127.0.0.1:6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    environment:
      QDRANT__SERVICE__GRPC_PORT: 6334
      QDRANT__TELEMETRY_DISABLED: "true"
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  postgres:
    image: postgres:15-alpine
    container_name: vectorflow-postgres
    restart: unless-stopped
    ports:
      # 5433 on the host so it doesn't clash with a locally installed PostgreSQL
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5433}:5432"
    environment:
      <<: *postgres-env
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: vectorflow-redis
    restart: unless-stopped
    # No host port: only the gateway (inside Docker) talks to Redis.
    # To inspect it, use: docker compose exec redis redis-cli
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  python-service:
    build:
      context: ./python-service
    container_name: vectorflow-python
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"   # Swagger UI at http://localhost:8000/docs
    environment:
      QDRANT_HOST: qdrant
      QDRANT_PORT: 6333
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-text-embedding-3-small}
      EMBEDDING_DIMENSIONS: ${EMBEDDING_DIMENSIONS:-1536}
      LLM_MODEL: ${LLM_MODEL:-gpt-4o-mini}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-change-me-internal-api-key}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:8080}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      SECURITY_STRICT: ${SECURITY_STRICT:-false}
    depends_on:
      qdrant:
        condition: service_healthy

  gateway:
    build:
      context: ./gateway
    container_name: vectorflow-gateway
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"   # GraphiQL at http://localhost:8080/graphiql (this machine only)
    environment:
      <<: *postgres-env
      PYTHON_SERVICE_URL: http://python-service:8000
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-change-me-internal-api-key}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: ${JWT_SECRET:-vectorflow-super-secret-key-change-in-production}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:8080}
      GRAPHIQL_ENABLED: ${GRAPHIQL_ENABLED:-true}
      GRAPHQL_INTROSPECTION: ${GRAPHQL_INTROSPECTION:-true}
      SECURITY_STRICT: ${SECURITY_STRICT:-false}
      RATE_LIMIT_ASK_PER_MINUTE: ${RATE_LIMIT_ASK_PER_MINUTE:-30}
      RATE_LIMIT_UPLOADS_PER_HOUR: ${RATE_LIMIT_UPLOADS_PER_HOUR:-60}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      python-service:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
    container_name: vectorflow-frontend
    restart: unless-stopped
    ports:
      - "3000:80"   # Web app at http://localhost:3000
    depends_on:
      - gateway

volumes:
  qdrant_data:
  postgres_data:
  redis_data:

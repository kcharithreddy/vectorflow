# Automated dependency updates (security patches + version bumps), batched monthly.
version: 2
updates:
  - package-ecosystem: maven
    directory: /vectorflow/gateway
    schedule: { interval: monthly }
    open-pull-requests-limit: 3
    groups:
      gateway: { patterns: ["*"] }

  - package-ecosystem: pip
    directory: /vectorflow/python-service
    schedule: { interval: monthly }
    open-pull-requests-limit: 3
    groups:
      python-service: { patterns: ["*"] }

  - package-ecosystem: npm
    directory: /vectorflow/frontend
    schedule: { interval: monthly }
    open-pull-requests-limit: 3
    groups:
      frontend: { patterns: ["*"] }

  - package-ecosystem: docker
    directory: /vectorflow/python-service
    schedule: { interval: monthly }

  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly }

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python-service:
    name: Python service tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vectorflow/python-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: vectorflow/python-service/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q

  gateway:
    name: Gateway build & tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vectorflow/gateway
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - run: mvn -B verify

  compose:
    name: Validate docker-compose
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vectorflow
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config --quiet
      - run: docker compose -f docker-compose.yml -f docker-compose.dev.yml config --quiet
